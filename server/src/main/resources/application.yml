server:
  port: ${PORT:8090}

spring:
  application:
    name: appcontrol-server
  datasource:
    # La clave y la direccion de la base NO van en el codigo: se leen del entorno (App Service > Configuracion).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appcontrol}
    username: ${DB_USER:acadmin}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health
