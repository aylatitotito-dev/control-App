# Cliente de escritorio (.exe): BD embebida en archivo, sin instalar nada y sin puertos.
spring:
  datasource:
    url: jdbc:h2:file:${APPDATA:${user.home}}/AppControl/data/appcontrol;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update   # sin migraciones aun; evaluar Flyway antes de publicar
